services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Forwards signals to node so the container stops promptly.
    init: true
    ports:
      - '${APP_HOST_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_URL: redis://redis:6379
    # service_started, not service_healthy: the app must start and report unhealthy when Redis
    # is unavailable.
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.status === 200 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_HOST_PORT:-6390}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
