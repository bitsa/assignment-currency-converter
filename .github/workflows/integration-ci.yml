name: integration-ci

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-ci:
    name: integration-ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start the stack
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build

      # The deadline starts after `up` returns, so image build time does not count against it.
      - name: Wait for /health
        run: |
          deadline=$((SECONDS + 120))
          while true; do
            code=$(curl -sS -o /dev/null --max-time 5 -w '%{http_code}' http://localhost:3000/health || true)
            echo "GET /health -> $code"
            if [ "$code" = "200" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "stack not healthy within 120 s" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Integration tests
        run: npm run test:integration:ci -w backend

      - name: Dump stack logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps -a
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color --timestamps

      - name: Tear down the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v --remove-orphans
